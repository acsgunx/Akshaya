name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Runs first and takes seconds. These checks fail on the things a compiler cannot see —
  # a broker name leaking into the core, a manifest that lies about its capabilities — and
  # there is no point spending three minutes on a build to then fail on one of those.
  verify-structure:
    name: Structure and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Static structure checks
        run: python3 scripts/verify-structure.py
      - name: Validate connector manifests against the schema
        run: python3 scripts/validate-manifests.py

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Akshaya.sln

      - name: Build
        run: dotnet build Akshaya.sln --no-restore --configuration Release

      # Run the architecture rules on their own and before everything else, so a violation is
      # reported as "you broke the design" rather than buried in a list of 400 passing tests.
      - name: Architecture rules
        run: >
          dotnet test tests/Akshaya.Architecture.Tests
          --no-build --configuration Release --logger "trx;LogFileName=architecture.trx"

      # The conformance suite runs against two deliberately different fake brokers. Green here
      # is the standing proof that the connector abstraction spans real differences.
      - name: Connector conformance
        run: >
          dotnet test tests/Akshaya.Connectors.TestKit
          --no-build --configuration Release --logger "trx;LogFileName=conformance.trx"

      - name: All tests with coverage
        run: >
          dotnet test Akshaya.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: verify-structure
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Vitest via `@angular/build:unit-test` — headless in jsdom, no Chrome on the runner.
      - run: npm run test -- --no-watch
      - run: npm run build

  # The deployment artifact. Building it in CI is what keeps deploy/Dockerfile honest: it is the
  # only place the API and the Angular app are compiled together into one image, and a change that
  # breaks that combination is otherwise invisible until someone deploys.
  #
  # Build only — nothing is pushed. Each target in deploy/ pushes from its own tooling.
  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: akshaya:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually serves: default persistence mode, no database server, no
      # volume. If this passes, `docker run` on any of the targets in deploy/ will too.
      - name: Smoke-test the image
        run: |
          docker run -d --name akshaya-ci -p 8080:8080 \
            -e CredentialProtection__ActiveKeyId=ci-1 \
            -e CredentialProtection__Keys__ci-1="$(openssl rand -base64 32)" \
            akshaya:ci

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
          done

          curl -fsS http://localhost:8080/health/ready
          # The Angular app must be served from the same origin as the API — that co-hosting is
          # the whole reason a deployment is one service instead of two.
          curl -fsS http://localhost:8080/ | grep -q "<ak-root" \
            || { echo "index.html did not come back from / — is the Angular build landing in wwwroot?"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs akshaya-ci || true

  # Not a gate yet — reported so the first vulnerable transitive dependency does not arrive
  # unannounced. Make it a gate once the dependency set has settled.
  dependency-scan:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Akshaya.sln
      - name: List vulnerable and deprecated packages
        run: |
          dotnet list Akshaya.sln package --vulnerable --include-transitive
          dotnet list Akshaya.sln package --deprecated
