<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Akshaya</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Roboto + Material Symbols: self-hosted at build time in a real deploy; Google Fonts
       here only to keep this scaffold runnable without a font pipeline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <ak-root>
    <!-- Static skeleton shown until the app bootstraps; avoids a blank white/black flash
         because we are dark-by-default and the OS default background may not be. -->
    <style>
      ak-root:empty {
        display: block;
        min-height: 100vh;
        background: #14161a;
      }
    </style>
  </ak-root>
</body>
</html>
