<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Akshaya</title>
  <base href="/" />
  <!-- `viewport-fit=cover` lets the page draw under the notch and home indicator so the
       shell can pad itself with `env(safe-area-inset-*)` — without it those insets read 0
       and the bottom tab bar sits under the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Tints the mobile browser's own toolbar to match the top bar. Starts dark (the
       default theme); `AppearanceStore` rewrites it when the user picks light. -->
  <meta name="theme-color" content="#1a1d22" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Roboto + Material Symbols: self-hosted at build time in a real deploy; Google Fonts
       here only to keep this scaffold runnable without a font pipeline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <!-- The ligature font <mat-icon> resolves against. Without it every icon renders as its
       literal name ("schedule", "check_circle"). Self-hosted in a real deploy. -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
</head>
<body>
  <ak-root>
    <!-- Static skeleton shown until the app bootstraps; avoids a blank white/black flash
         because we are dark-by-default and the OS default background may not be. -->
    <style>
      ak-root:empty {
        display: block;
        min-height: 100vh;
        background: #14161a;
      }
    </style>
  </ak-root>
</body>
</html>
