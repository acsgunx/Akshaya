<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Akshaya</title>
  <base href="/" />
  <!-- `viewport-fit=cover` lets the page draw under the notch and home indicator so the
       shell can pad itself with `env(safe-area-inset-*)` — without it those insets read 0
       and the bottom tab bar sits under the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Tints the mobile browser's own toolbar to match the top bar. Starts dark (the
       default theme); `AppearanceStore` rewrites it when the user picks light. -->
  <meta name="theme-color" content="#1a1d22" />
  <!-- SVG first for browsers that take it; the .ico stays for the rest.
       `public/icon.svg` is the master artwork — the same mark the header and
       the boot splash draw inline. -->
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <!-- Roboto + Material Symbols: self-hosted at build time in a real deploy; Google Fonts
       here only to keep this scaffold runnable without a font pipeline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <!-- The ligature font <mat-icon> resolves against. Without it every icon renders as its
       literal name ("schedule", "check_circle"). Self-hosted in a real deploy. -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
  <!-- A saved light theme, applied before first paint. `AppearanceStore` owns `data-theme`
       from bootstrap on, reading the same key; without this a light-theme user gets a dark
       splash that flips to light the moment the app starts. -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem('akshaya.appearance') || '{}').theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  </script>
  <!-- Boot splash — see `src/app/shell/boot-splash.ts` for what it covers and who removes it. Inline
       because it must paint before the stylesheet or the bundle arrive; the colours restate
       `tailwind.css` tokens for the same reason. -->
  <style>
    #ak-boot {
      color-scheme: dark;
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: light-dark(#f4f6fa, #14161a);
      color: light-dark(#383f4b, #98a1b3);
      font: 400 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1);
    }
    :root[data-theme='light'] #ak-boot { color-scheme: light; }
    #ak-boot[data-state='leaving'] { opacity: 0; pointer-events: none; }
    #ak-boot p { margin: 0; }
    #ak-boot a { color: light-dark(#7d00fa, #d5baff); }
    .ak-boot-logo { width: 56px; height: 56px; }
    .ak-boot-mark { font-size: 20px; font-weight: 700; color: light-dark(#14161a, #f4f6fa); }
    .ak-boot-track { width: 160px; height: 2px; overflow: hidden; border-radius: 2px; background: light-dark(#e2e6ee, #2a2f38); }
    .ak-boot-track::before {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: light-dark(#7d00fa, #d5baff);
      animation: ak-boot-sweep 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes ak-boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    /* Room for every hint up front, so a hint appearing never nudges the wordmark. */
    .ak-boot-status { display: grid; align-content: start; gap: 4px; min-height: 72px; max-width: 40ch; }
    /* Timed hints: hidden (not just transparent, so a screen reader skips them too) until
       their delay, then revealed inside the live region, which announces them. */
    .ak-boot-hint { visibility: hidden; animation: ak-boot-reveal 0s forwards; }
    .ak-boot-slow { animation-delay: 8s; }
    .ak-boot-stuck { animation-delay: 25s; }
    @keyframes ak-boot-reveal { to { visibility: visible; } }
    .ak-boot-failed { display: none; }
    #ak-boot[data-state='failed'] .ak-boot-failed { display: block; }
    #ak-boot[data-state='failed'] :is(.ak-boot-track, .ak-boot-label, .ak-boot-hint) { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #ak-boot { transition: none; }
      .ak-boot-track::before { width: 100%; animation: none; }
    }
  </style>
  <noscript>
    <style>#ak-boot :is(.ak-boot-track, .ak-boot-label, .ak-boot-hint) { display: none; }</style>
  </noscript>
</head>
<body>
  <div id="ak-boot">
    <!-- The brand mark, inlined: the splash must paint before any asset request
         returns. Same artwork as `public/icon.svg`. -->
    <svg class="ak-boot-logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="akb-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8f35ff" />
          <stop offset="1" stop-color="#4e00ba" />
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#akb-bg)" />
      <path d="M256 96v74" stroke="#fff" stroke-width="30" stroke-linecap="round" fill="none" />
      <path d="M150 396L228 196M284 196L362 396M224 196h64" stroke="#fff" stroke-width="54"
            stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M202 336l108-24" stroke="#fff" stroke-width="38" stroke-linecap="round" fill="none" />
    </svg>
    <p class="ak-boot-mark">Akshaya</p>
    <div class="ak-boot-track" aria-hidden="true"></div>
    <div class="ak-boot-status" role="status">
      <p class="ak-boot-label">Loading…</p>
      <p class="ak-boot-hint ak-boot-slow">Still loading — this is taking longer than usual.</p>
      <p class="ak-boot-hint ak-boot-stuck">Nothing yet? Check your connection, or <a href="">reload the page</a>.</p>
      <p class="ak-boot-failed">
        Akshaya could not start. <a href="">Reload the page</a> — if it keeps happening, the browser console has the details.
      </p>
      <noscript><p>Akshaya needs JavaScript to run. Turn it on for this site and reload.</p></noscript>
    </div>
  </div>
  <ak-root></ak-root>
</body>
</html>
